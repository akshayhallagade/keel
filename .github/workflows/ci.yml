name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Nothing in CI opens a database connection: the API tests mock the repository
      # layer, `prisma generate` reads the schema file, and `build` is type-checking
      # only. This value exists purely because config/env.ts requires DATABASE_URL to
      # be set, so it is spelled to look like what it is rather than like a real,
      # reachable database. Add a `services: postgres:` block below if a test that
      # actually queries ever lands.
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/keel_no_db_in_ci
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm --filter @keel/db run generate
      - run: pnpm build
      - run: pnpm test
