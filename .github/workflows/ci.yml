name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # A real database, because the repository tests query one. Mocks stopped
    # being enough once tables started having relations and owners: a mock will
    # happily agree that a user can read someone else's rows.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keel_test
        ports:
          - 5432:5432
        # Without this the job races the container and connects before it is up.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/keel_test
      # Must clear the 32-character minimum in config/env.ts. Not a secret —
      # this database exists for the length of one job.
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm --filter @keel/db run generate

      # `migrate deploy` rather than `migrate dev`: it applies the committed
      # migrations and nothing else. `dev` would try to generate new ones from
      # schema drift, which is not something CI should ever decide to do.
      - run: pnpm --filter @keel/db exec prisma migrate deploy

      - run: pnpm build
      - run: pnpm test
